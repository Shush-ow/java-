<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<title>STORE - CREATE ACCOUNT</title>
<style>
    /* Google Fontsから無機質で洗練された標準フォント（Inter）を読み込み */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500&display=swap');

    * {
        box-sizing: border-box;
    }

    body {
        /* 背景：ごく僅かに青みがかった冷たいダークグレー */
        background-color: #0f1115;
        color: #e2e8f0;
        font-family: 'Inter', 'Noto Sans JP', -apple-system, sans-serif;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        letter-spacing: 0.05em;
        padding: 40px 20px;
    }

    /* タイトルまわり */
    .brand-header {
        text-align: center;
        margin-bottom: 32px;
    }

    h1 {
        color: #ffffff;
        font-size: 1.35rem;
        font-weight: 500;
        letter-spacing: 0.18em;
        margin: 0 0 8px 0;
        text-transform: uppercase;
    }

    h2 {
        color: #64748b; /* 低彩度のスレートグレー */
        font-size: 0.75rem;
        font-weight: 400;
        margin: 0;
        text-transform: uppercase;
        letter-spacing: 0.1em;
    }

    /* フォームコンテナ */
    form {
        background-color: #161a22;
        border: 1px solid #262c36;
        border-radius: 6px;
        padding: 40px;
        width: 100%;
        max-width: 420px;
        box-sizing: border-box;
    }

    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        font-size: 0.75rem;
        color: #94a3b8;
        margin-bottom: 8px;
        font-weight: 400;
        letter-spacing: 0.08em;
    }

    /* 入力フィールド */
    input[type="text"],
    input[type="password"] {
        width: 100%;
        padding: 12px 14px;
        background-color: #0b0d11;
        border: 1px solid #2a313d;
        border-radius: 4px;
        color: #f1f5f9;
        font-size: 0.88rem;
        font-family: inherit;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
        border-color: #475569;
        outline: none;
        box-shadow: 0 0 0 1px #475569;
    }

    input[type="text"]::placeholder,
    input[type="password"]::placeholder {
        color: #334155;
    }

    /* 登録ボタン */
    input[type="submit"] {
        background-color: #e2e8f0;
        color: #0f1115;
        border: none;
        padding: 12px 20px;
        border-radius: 4px;
        font-size: 0.85rem;
        font-weight: 500;
        font-family: inherit;
        cursor: pointer;
        width: 100%;
        margin-top: 10px;
        letter-spacing: 0.08em;
        transition: background-color 0.2s ease, opacity 0.2s ease;
    }

    input[type="submit"]:hover {
        background-color: #ffffff;
    }

    input[type="submit"]:active {
        opacity: 0.8;
    }

    /* 区切り線と戻るリンク */
    .divider {
        height: 1px;
        background-color: #262c36;
        margin: 28px 0;
    }

    .back-link {
        display: block;
        text-align: center;
        background-color: transparent;
        color: #94a3b8;
        border: 1px solid #2a313d;
        text-decoration: none;
        padding: 10px 15px;
        border-radius: 4px;
        font-size: 0.8rem;
        letter-spacing: 0.05em;
        transition: all 0.2s ease;
    }

    .back-link:hover {
        border-color: #475569;
        color: #f1f5f9;
        background-color: rgba(255, 255, 255, 0.02);
    }
</style>
</head>
<body>

    <div class="brand-header">
        <h1>ONLINE STORE</h1>
        <h2>CREATE ACCOUNT</h2>
    </div>

    <form action="/RegistUserID" method="post">
        <div class="form-group">
            <label for="userid">USER ID</label>
            <input type="text" id="userid" name="userid" placeholder="ユーザーID">
        </div>

        <div class="form-group">
            <label for="password1">PASSWORD</label>
            <input type="password" id="password1" name="password1" placeholder="パスワード">
        </div>

        <div class="form-group">
            <label for="password2">CONFIRM PASSWORD</label>
            <input type="password" id="password2" name="password2" placeholder="パスワード（再入力）">
        </div>

        <div class="form-group">
            <label for="username">FULL NAME</label>
            <input type="text" id="username" name="username" placeholder="氏名">
        </div>

        <div class="form-group">
            <label for="address">ADDRESS</label>
            <input type="text" id="address" name="address" placeholder="住所">
        </div>

        <div class="form-group">
            <label for="email">EMAIL ADDRESS</label>
            <input type="text" id="email" name="email" placeholder="メールアドレス">
        </div>

        <input type="submit" value="REGISTER">

        <div class="divider"></div>

        <a href="/WebShop" class="back-link">SIGN IN 画面に戻る</a>
    </form>

</body>
</html>
