<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Xanadu - DARK MARKET</title>a
<style>
    @import url('https://fonts.googleapis.com/css2?family=Creepster&family=Shippori+Mincho:wght@400;600&family=Share+Tech+Mono&display=swap');
    
    * {
        box-sizing: border-box;
    }

    body {
        background-color: #050000;
        color: #8b0000;
        font-family: 'Shippori Mincho', serif;
        background-image: radial-gradient(circle, rgba(16,0,0,0.85) 0%, rgba(0,0,0,1) 85%);
        background-attachment: fixed;
        min-height: 100vh;
        margin: 0;
        padding: 40px 20px;
        text-shadow: 0 0 8px rgba(139, 0, 0, 0.8);
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* ヘッダーエリア */
    header {
        width: 100%;
        max-width: 1000px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #4a0000;
        padding-bottom: 15px;
        margin-bottom: 40px;
    }

    h1 {
        font-family: 'Creepster', cursive;
        color: #ff0000;
        font-size: 3rem;
        margin: 0;
        letter-spacing: 0.1em;
        text-shadow: 0 0 12px rgba(255, 0, 0, 0.9);
    }

    .user-status {
        font-family: 'Share Tech Mono', monospace;
        font-size: 0.85rem;
        color: #ff3333;
        letter-spacing: 0.05em;
    }

    .btn-logout {
        background: transparent;
        border: 1px solid #8b0000;
        color: #ff0000;
        font-family: 'Share Tech Mono', monospace;
        padding: 6px 12px;
        cursor: pointer;
        text-shadow: inherit;
        transition: all 0.2s;
        margin-left: 15px;
    }

    .btn-logout:hover {
        background-color: #300000;
        border-color: #ff0000;
        box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
    }

    /* メインコンテナ */
    .container {
        width: 100%;
        max-width: 1000px;
    }

    .notice {
        font-family: 'Share Tech Mono', monospace;
        color: #600000;
        font-size: 0.8rem;
        text-align: center;
        margin-bottom: 30px;
        border: 1px dashed #4a0000;
        padding: 10px;
        background-color: rgba(10, 0, 0, 0.6);
    }

    /* 商品グリッド */
    .product-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 25px;
    }

    /* 商品カード */
    .product-card {
        background: rgba(10, 0, 0, 0.7);
        border: 1px solid #4a0000;
        padding: 20px;
        display: flex;
        flex-direction: column;
        transition: all 0.3s ease;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.9);
    }

    .product-card:hover {
        border-color: #ff0000;
        box-shadow: 0 0 15px rgba(139, 0, 0, 0.6);
        transform: translateY(-2px);
    }

    /* 追加：赤黒デザイン用の画像スタイル */
    .product-image {
        width: 100%;
        height: 160px;
        object-fit: cover;
        border: 1px solid #4a0000;
        margin-bottom: 12px;
        filter: grayscale(80%) sepia(100%) hue-rotate(310deg) saturate(500%);
        transition: filter 0.3s ease;
    }

    .product-card:hover .product-image {
        filter: none; /* ホバー時に元の色を表示 */
    }

    .product-id {
        font-family: 'Share Tech Mono', monospace;
        font-size: 0.75rem;
        color: #550000;
        margin-bottom: 10px;
    }

    .product-name {
        font-size: 1.15rem;
        color: #cc0000;
        margin: 0 0 10px 0;
        font-weight: 600;
    }

    .product-desc {
        font-size: 0.85rem;
        color: #700000;
        line-height: 1.5;
        margin-bottom: 20px;
        flex-grow: 1;
        text-shadow: none;
    }

    .product-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: auto;
        padding-top: 15px;
        border-top: 1px solid #200000;
    }

    .product-price {
        font-family: 'Share Tech Mono', monospace;
        font-size: 1.1rem;
        color: #ff0000;
        font-weight: bold;
    }

    .btn-buy {
        background-color: #200000;
        border: 1px solid #8b0000;
        color: #ff3333;
        font-family: 'Shippori Mincho', serif;
        padding: 8px 16px;
        font-size: 0.85rem;
        cursor: pointer;
        transition: all 0.2s;
        text-shadow: inherit;
    }

    .btn-buy:hover {
        background-color: #600000;
        color: #ffffff;
        border-color: #ff0000;
        box-shadow: 0 0 10px rgba(255, 0, 0, 0.8);
    }
</style>
</head>
<body>

    <header>
        <h1>Xanadu</h1>
        <div class="user-status">
            NODE: <span th:text="${name}">UNKNOWN_ENTRY</span>
            <form action="/UserLogout" method="post" style="display:inline;">
                <input type="submit" value="DISCONNECT" class="btn-logout">
            </form>
        </div>
    </header>

    <div class="container">
        <div class="notice">
            [WARNING] ALL TRANSACTIONS ARE ENCRYPTED AND IRREVERSIBLE.
        </div>

        <div class="product-grid">
            <!-- DBから動的に商品一覧を表示 -->
            <div th:each="product : ${products}" class="product-card">
                <!-- 商品画像 -->
                <img th:src="@{'/images/' + ${product.image}}" alt="商品画像" class="product-image">
                
                <div class="product-id" th:text="'ITEM_ID: #' + ${product.id}">ITEM_ID: #0x0000</div>
                <h2 class="product-name" th:text="${product.name}">Product Name</h2>
                <div class="product-desc" th:text="${product.category}">
                    CATEGORY
                </div>
                <div class="product-footer">
                    <div class="product-price" th:text="'¥' + ${#numbers.formatInteger(product.price, 1, 'COMMA')}">¥0</div>
                    
                    <!-- カート追加 / 購入フォーム -->
                    <form action="/cart/add" method="post" style="margin:0;">
                        <input type="hidden" name="productId" th:value="${product.id}">
                        <button type="submit" class="btn-buy">購入手続き</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
