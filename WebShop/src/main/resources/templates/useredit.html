<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<title>STORE - USER INFORMATION</title>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500&display=swap');

    * {
        box-sizing: border-box;
    }

    body {
        background-color: #0f1115;
        color: #e2e8f0;
        font-family: 'Inter', 'Noto Sans JP', -apple-system, sans-serif;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        letter-spacing: 0.05em;
        padding: 40px 20px;
    }

    .brand-header {
        text-align: center;
        margin-bottom: 32px;
    }

    h1 {
        color: #ffffff;
        font-size: 1.35rem;
        font-weight: 500;
        letter-spacing: 0.18em;
        margin: 0 0 8px 0;
        text-transform: uppercase;
    }

    h2 {
        color: #64748b;
        font-size: 0.75rem;
        font-weight: 400;
        margin: 0;
        text-transform: uppercase;
        letter-spacing: 0.1em;
    }

    form {
        background-color: #161a22;
        border: 1px solid #262c36;
        border-radius: 6px;
        padding: 40px;
        width: 100%;
        max-width: 420px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        font-size: 0.75rem;
        color: #94a3b8;
        margin-bottom: 8px;
        font-weight: 400;
        letter-spacing: 0.08em;
    }

    input[type="text"],
    input[type="password"] {
        width: 100%;
        padding: 12px 14px;
        background-color: #0b0d11;
        border: 1px solid #2a313d;
        border-radius: 4px;
        color: #f1f5f9;
        font-size: 0.88rem;
        font-family: inherit;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
        border-color: #475569;
        outline: none;
        box-shadow: 0 0 0 1px #475569;
    }

    input[type="submit"] {
        background-color: #e2e8f0;
        color: #0f1115;
        border: none;
        padding: 12px 20px;
        border-radius: 4px;
        font-size: 0.85rem;
        font-weight: 500;
        font-family: inherit;
        cursor: pointer;
        width: 100%;
        margin-top: 10px;
        letter-spacing: 0.08em;
        transition: background-color 0.2s ease, opacity 0.2s ease;
    }

    input[type="submit"]:hover {
        background-color: #ffffff;
    }

    input[type="submit"]:active {
        opacity: 0.8;
    }

    .divider {
        height: 1px;
        background-color: #262c36;
        margin: 28px 0;
    }

    .back-link {
        display: block;
        text-align: center;
        background-color: transparent;
        color: #94a3b8;
        border: 1px solid #2a313d;
        text-decoration: none;
        padding: 10px 15px;
        border-radius: 4px;
        font-size: 0.8rem;
        letter-spacing: 0.05em;
        transition: all 0.2s ease;
    }

    .back-link:hover {
        border-color: #475569;
        color: #f1f5f9;
        background-color: rgba(255, 255, 255, 0.02);
    }

    .userid {
        color: #64748b;
    }
</style>
</head>

<body>

    <div class="brand-header">
        <h1>ONLINE STORE</h1>
        <h2>USER INFORMATION</h2>
    </div>

    <form action="/UpdateUser" method="post">

        <!-- USER ID -->
        <div class="form-group">
            <label for="userid">USER ID</label>
            <input type="text"
                   id="userid"
                   name="userid"
                   th:value="${user.userid}"
                   readonly
                   class="userid">
        </div>

		<!-- existing password -->
		<div class="form-group">
		    <label for="currentPassword">CURRENT PASSWORD</label>
		    <input type="password"
		           id="currentPassword"
		           name="currentPassword"
		           placeholder="現在のパスワード"
		           required>
		</div>
		
		<!-- new password -->
		<div class="form-group">
		    <label for="newPassword">NEW PASSWORD</label>
		    <input type="password"
		           id="newPassword"
		           name="newPassword"
		           placeholder="新しいパスワード"
		           required>
		</div>

        <!-- FULL NAME -->
        <div class="form-group">
            <label for="username">FULL NAME</label>
            <input type="text"
                   id="username"
                   name="username"
                   th:value="${user.username}"
                   placeholder="氏名">
        </div>

        <!-- ADDRESS -->
        <div class="form-group">
            <label for="address">ADDRESS</label>
            <input type="text"
                   id="address"
                   name="address"
                   th:value="${user.address}"
                   placeholder="住所">
        </div>

        <!-- EMAIL -->
        <div class="form-group">
            <label for="email">EMAIL ADDRESS</label>
            <input type="text"
                   id="email"
                   name="email"
                   th:value="${user.email}"
                   placeholder="メールアドレス">
        </div>

        <input type="submit" value="UPDATE">

        <div class="divider"></div>

        <a href="/toppage" class="back-link">
            BACK TO STORE
        </a>

    </form>
    
	    <p th:if="${errorMessage}"
	       th:text="${errorMessage}"
	       style="color: #f87171;">
		</p>

</body>
</html>
