<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>STORE - UPDATE COMPLETE</title>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500&display=swap');

    * {
        box-sizing: border-box;
    }

    body {
        background-color: #0f1115;
        color: #e2e8f0;
        font-family: 'Inter', 'Noto Sans JP', sans-serif;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        letter-spacing: 0.05em;
        padding: 40px 20px;
    }

    .brand-header {
        text-align: center;
        margin-bottom: 32px;
    }

    h1 {
        color: #ffffff;
        font-size: 1.35rem;
        font-weight: 500;
        letter-spacing: 0.18em;
        margin: 0 0 8px 0;
        text-transform: uppercase;
    }

    h2 {
        color: #64748b;
        font-size: 0.75rem;
        font-weight: 400;
        margin: 0;
        text-transform: uppercase;
        letter-spacing: 0.1em;
    }

    .message-box {
        background-color: #161a22;
        border: 1px solid #262c36;
        border-radius: 6px;
        padding: 40px;
        width: 100%;
        max-width: 420px;
        text-align: center;
    }

    .message {
        color: #e2e8f0;
        font-size: 0.9rem;
        line-height: 1.8;
        margin-bottom: 28px;
    }

    .back-link {
        display: block;
        text-align: center;
        background-color: #e2e8f0;
        color: #0f1115;
        text-decoration: none;
        padding: 12px 15px;
        border-radius: 4px;
        font-size: 0.8rem;
        letter-spacing: 0.05em;
    }

    .back-link:hover {
        background-color: #ffffff;
    }
</style>
</head>

<body>

    <div class="brand-header">
        <h1>ONLINE STORE</h1>
        <h2>UPDATE COMPLETE</h2>
    </div>

    <div class="message-box">

        <div class="message">
            ユーザー情報の更新が完了しました。
        </div>

        <a href="/toppage" class="back-link">
            TOP PAGE に戻る
        </a>

    </div>

</body>
</html>
