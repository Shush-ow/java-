<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Re-LogIn</title>
<style>
    /* Google Fontsから無機質で洗練された標準フォント（Inter）を読み込み */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500&display=swap');

    * {
        box-sizing: border-box;
    }

    body {
        /* 背景：ごく僅かに青みがかった冷たいダークグレー */
        background-color: #0f1115;
        color: #e2e8f0;
        font-family: 'Inter', 'Noto Sans JP', -apple-system, sans-serif;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        letter-spacing: 0.05em;
    }

    /* タイトルまわりは控えめでタイトな文字組に */
    .brand-header {
        text-align: center;
        margin-bottom: 32px;
    }

    h1 {
        color: #ffffff;
        font-size: 1.35rem;
        font-weight: 500;
        letter-spacing: 0.18em;
        margin: 0 0 8px 0;
        text-transform: uppercase;
    }

    h2 {
        color: #64748b; /* 低彩度の落ち着いたスレートグレー */
        font-size: 0.75rem;
        font-weight: 400;
        margin: 0;
        text-transform: uppercase;
        letter-spacing: 0.1em;
    }

    /* ログインフォームのコンテナ（ミニマルな角丸と極細ボーダー） */
    .login-container {
        background-color: #161a22;
        border: 1px solid #262c36;
        border-radius: 6px;
        padding: 40px;
        width: 100%;
        max-width: 380px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        font-size: 0.75rem;
        color: #94a3b8;
        margin-bottom: 8px;
        font-weight: 400;
        letter-spacing: 0.08em;
    }

    /* 入力欄：平面でエッジの効いた質感 */
    input[type="text"],
    input[type="password"] {
        width: 100%;
        padding: 12px 14px;
        background-color: #0b0d11;
        border: 1px solid #2a313d;
        border-radius: 4px;
        color: #f1f5f9;
        font-size: 0.88rem;
        font-family: inherit;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
        border-color: #475569;
        outline: none;
        box-shadow: 0 0 0 1px #475569;
    }

    input[type="text"]::placeholder,
    input[type="password"]::placeholder {
        color: #334155;
    }

    /* ログインボタン（フラットなソリッドカラー） */
    input[type="submit"] {
        background-color: #e2e8f0;
        color: #0f1115;
        border: none;
        padding: 12px 20px;
        border-radius: 4px;
        font-size: 0.85rem;
        font-weight: 500;
        font-family: inherit;
        cursor: pointer;
        width: 100%;
        margin-top: 10px;
        letter-spacing: 0.08em;
        transition: background-color 0.2s ease, opacity 0.2s ease;
    }

    input[type="submit"]:hover {
        background-color: #ffffff;
    }

    input[type="submit"]:active {
        opacity: 0.8;
    }

    /* 区切り線と新規登録リンク */
    .divider {
        height: 1px;
        background-color: #262c36;
        margin: 28px 0;
    }

    .sub-text {
        font-size: 0.75rem;
        color: #64748b;
        text-align: center;
        margin-bottom: 12px;
        letter-spacing: 0.05em;
    }

    .regist-btn {
        display: block;
        text-align: center;
        background-color: transparent;
        color: #94a3b8;
        border: 1px solid #2a313d;
        text-decoration: none;
        padding: 10px 15px;
        border-radius: 4px;
        font-size: 0.8rem;
        letter-spacing: 0.05em;
        transition: all 0.2s ease;
    }

    .regist-btn:hover {
        border-color: #475569;
        color: #f1f5f9;
        background-color: rgba(255, 255, 255, 0.02);
    }
</style>
</head>
<body>
<h3>ユーザIDが見つからないか、パスワードが間違っています</h3>
<form action="/UserLogin" method="post">
	<p>ユーザID：<br>
	<input type="text" name="userid"></p>
	<p>パスワード：<br>
	<input type="text" name="password"></p>
	<p><input type="submit" value="ログイン"></p>
        <h3>新規登録の方はユーザID登録ボタンをクリックしてください</h3>
	<p><input type="submit" value="ユーザID登録"></p>
</form>
</body>
</html>
