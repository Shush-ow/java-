<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>Re-LogIn</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            background-color: #0f1115;
            color: #e2e8f0;
            font-family: 'Inter', 'Noto Sans JP', -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
            letter-spacing: 0.05em;
        }

        /* タイトル */
        .brand-header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            color: #ffffff;
            font-size: 1.35rem;
            font-weight: 500;
            letter-spacing: 0.18em;
            margin: 0 0 6px;
            text-transform: uppercase;
        }

        h2 {
            color: #64748b;
            font-size: 0.75rem;
            font-weight: 400;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* ログインフォーム */
        .login-container {
            background-color: #161a22;
            border: 1px solid #262c36;
            border-radius: 6px;
            padding: 40px;
            width: 100%;
            max-width: 380px;
        }

        /* エラーメッセージ */
        .error-message {
            color: #f87171;
            font-size: 0.85rem;
            text-align: center;
            margin: 0 0 28px;
            line-height: 1.8;
        }

        /* 入力欄 */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            color: #94a3b8;
            margin-bottom: 6;
            font-weight: 400;
            letter-spacing: 0.08em;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            background-color: #0b0d11;
            border: 1px solid #2a313d;
            border-radius: 4px;
            color: #f1f5f9;
            font-size: 0.88rem;
            font-family: inherit;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #475569;
            outline: none;
            box-shadow: 0 0 0 1px #475569;
        }

        input::placeholder {
            color: #475569;
        }

        /* ボタン共通 */
        input[type="submit"] {
            width: 100%;
            padding: 12px 20px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            letter-spacing: 0.08em;
            transition: background-color 0.2s ease, opacity 0.2s ease;
        }

        /* ログインボタン */
        .login-btn {
            background-color: #e2e8f0;
            color: #0f1115;
            border: none;
            margin-top: 10px;
        }

        .login-btn:hover {
            background-color: #ffffff;
        }

        .login-btn:active {
            opacity: 0.8;
        }

        /* 区切り線 */
        .divider {
            height: 1px;
            background-color: #262c36;
            margin: 28px 0;
        }

        /* 新規登録の案内 */
        .sub-text {
            font-size: 0.75rem;
            color: #64748b;
            text-align: center;
            margin-bottom: 12px;
            line-height: 1.8;
        }

        /* 新規登録ボタン */
        .regist-btn {
            display: block;
            width: 100%;
            text-align: center;
            background-color: transparent;
            color: #94a3b8;
            border: 1px solid #2a313d;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 4px;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
            transition: all 0.2s ease;
        }

        .regist-btn:hover {
            border-color: #475569;
            color: #f1f5f9;
            background-color: rgba(255, 255, 255, 0.02);
        }

        /* 小さい画面への対応 */
        @media (max-width: 420px) {
            .login-container {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

    <div class="brand-header">
        <h1>Xanadu</h1>
        <h2>PRODUCTS</h2>
    </div>

    <div class="login-container">

        <p class="error-message">
            ユーザIDが見つからないか、<br>
            パスワードが間違っています。
        </p>

        <form action="/UserLogin" method="post">

            <div class="form-group">
                <label for="userid">ユーザID</label>
                <input
                    type="text"
                    id="userid"
                    name="userid"
                    placeholder="ユーザIDを入力してください"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">パスワード</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="パスワードを入力してください"
                    required
                >
            </div>

            <input
                type="submit"
                class="login-btn"
                value="ログイン"
            >

        </form>

        <div class="divider"></div>

        <p class="sub-text">
            初めてご利用の方はこちらから<br>
            ユーザIDを登録してください。
        </p>

        <a href="/RegistUserID" class="regist-btn">
            ユーザID登録
        </a>

    </div>

</body>
</html>
