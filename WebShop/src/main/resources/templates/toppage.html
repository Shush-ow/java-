<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Xanadu - PRODUCTS</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500&display=swap');
    * { box-sizing: border-box; }
    body { background-color: #0f1115; color: #e2e8f0; font-family: 'Inter', 'Noto Sans JP', sans-serif; margin: 0; min-height: 100vh; }
    header { background-color: #161a22; border-bottom: 1px solid #262c36; padding: 18px 40px; display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.25rem; font-weight: 500; color: #ffffff; letter-spacing: 0.2em; margin: 0; }
    .user-info { display: flex; align-items: center; gap: 20px; }
    .btn { padding: 8px 16px; border-radius: 4px; font-size: 0.78rem; text-decoration: none; cursor: pointer; border: none; font-family: inherit; }
    .btn-logout { background: transparent; color: #94a3b8; border: 1px solid #2a313d; }
    .btn-cart-nav { background-color: #2a313d; color: #f1f5f9; text-decoration: none; padding: 8px 14px; border-radius: 4px; font-size: 0.8rem; }
    .container { max-width: 1100px; margin: 40px auto; padding: 0 24px; }
    .shop-title-area { margin-bottom: 30px; border-bottom: 1px solid #262c36; padding-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
    select { background: #0b0d11; color: #e2e8f0; border: 1px solid #2a313d; padding: 8px 12px; border-radius: 4px; }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 24px; }
    .product-card { background-color: #161a22; border: 1px solid #262c36; border-radius: 6px; padding: 16px; display: flex; flex-direction: column; }
    .product-category { font-size: 0.7rem; color: #64748b; }
    .product-name { font-size: 0.88rem; color: #f1f5f9; margin: 8px 0; }
    .product-price { font-size: 0.95rem; font-weight: 500; color: #ffffff; margin-top: auto; margin-bottom: 12px; }
    .btn-cart { background-color: #e2e8f0; color: #0f1115; width: 100%; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: 500; }
	.product-image { width: 100%; height: auto; max-height: 160px; object-fit: contain; border-radius: 4px; margin-bottom: 12px;}
	.user-link { display: inline-block; padding: 10px 16px; border: 1px solid #334155; border-radius: 8px; font-size: 0.8rem; color: #94a3b8; text-decoration: none; 
	             cursor: pointer; background-color: #1e293b; transition: all 0.2s ease; }
	.user-link:hover { color: #ffffff; border-color: #38bdf8; background-color: #334155; box-shadow: 0 0 8px rgba(56, 189, 248, 0.2); }
</style>
</head>
<body>
    <header>
        <h1>Xanadu</h1>
        <div class="user-info">
            <a href="/UserEdit" class="user-link">USER: <span th:text="${name}">GUEST</span></a>
            <a href="/cart" class="btn-cart-nav">🛒 カート (<span th:text="${cartCount}">0</span>)</a>
            <form action="/UserLogout" method="post" style="margin:0;">
                <input type="submit" value="LOGOUT" class="btn btn-logout">
            </form>
        </div>
    </header>

    <div class="container">
        <div class="shop-title-area">
            <h2 style="font-size:1.1rem; margin:0;">COLLECTION</h2>
            <form action="/toppage" method="get">
                <select name="sort" onchange="this.form.submit()">
                    <option value="">並び替え: 標準</option>
                    <option value="price_asc" th:selected="${currentSort == 'price_asc'}">価格が安い順</option>
                    <option value="price_desc" th:selected="${currentSort == 'price_desc'}">価格が高い順</option>
                    <option value="name" th:selected="${currentSort == 'name'}">商品名順</option>
                </select>
            </form>
        </div>

		<div class="product-grid">
		            <div th:each="product : ${products}" class="product-card">
						<img th:src="@{'/images/' + ${product.image}}" alt="商品画像" class="product-image">

		                <span class="product-category" th:text="${product.category}">CATEGORY</span>
		                <h3 class="product-name" th:text="${product.name}">Product Name</h3>
		                <div class="product-price" th:text="'¥' + ${#numbers.formatInteger(product.price, 1, 'COMMA')}">¥0</div>
		                <form action="/cart/add" method="post">
		                    <input type="hidden" name="productId" th:value="${product.id}">
		                    <button type="submit" class="btn btn-cart">ADD TO CART</button>
		                </form>
		            </div>
		 </div>
    </div>
</body>
</html>
